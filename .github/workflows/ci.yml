name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (ruff + pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Unit tests (no Docker required)
        run: python -m pytest -q -m "not integration"

  integration-tests:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pull sandbox image
        run: docker pull alpine

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Docker integration tests (real container)
        run: python -m pytest -q -m integration -v
